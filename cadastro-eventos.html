<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de eventos</title>

  <link rel="stylesheet" href="styles.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
</head>

<body>
  <header>
    <h1>Cadastro de eventos</h1>
    <h2>Cadastre seu evento em minutos e conecte pessoas através do lazer e da cultura na sua comunidade.</h2>
    <a href="index.html">Voltar para o início</a>
  </header>
  <main>
    <section class="event-form">
      <div class="event-card">
        <form action="#" method="post">

          <fieldset>
            <legend>Crie seu evento</legend>

            <label for="nome" class="required">Nome do evento:</label>
            <input type="text" name="nome" id="nome" placeholder="Digite o nome do evento" required>

            <label for="organizador" class="required">Quem está organizando o evento?</label>
            <input type="text" name="organizador" id="organizador" placeholder="Digite o nome organizador do evento"
              required>

            <label for="email" class="required">E-mail:</label>
            <input type="email" name="email" id="email" placeholder="Digite seu e-mail" required>

            <label for="endereco" class="required">Endereço</label>
            <input type="text" id="endereco" placeholder="Av/rua, Nº, referência " required>

            <label for="telefone" class="required">Telefone:</label>
            <input type="telefone" name="telefone" id="telefone" placeholder="(99) 99999-9999" required>

            <section id="categoria" nome="categoria"></section>
            <label for="tipo-de-evento" class="required">Categoria</label>
            <Select id="tipo-de-evento" name="tipo-de-evento" required>
              <option value="">Selecione</option>
              <option value="esportes">Esportes</option>
              <option value="evento-cultural">Evento cultural</option>
              <option value="feira-gastronomica">Feira gastronômica</option>
              <option value="adote-um-pet">Adote um pet</option>
            </select>
            <div class="action-form">
              <button class="button-cancel">Cancelar</button>
              <button class="button-save" type="submit">Salvar</button>
            </div>
          </fieldset>
        </form>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>

</html>
