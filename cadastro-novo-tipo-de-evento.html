<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cadastro de evento </title>
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <header>
        <h1>
            Novo tipo de evento
        </h1>
        <a href="index.html">Voltar para o início</a>
    </header>
    <main>
        <section class="event-form">
            <div class="event-card">
                <form action="#" method="post">
                    <img class="event-image" src="assets/imagem-novo-evento-IA.png" alt="">
                    <!--Dados-->
                    <fieldset>
                        <legend>Criar novo evento</legend>

                        <label for="nome" class="required">Nome do evento:</label>
                        <input type="text" name="nome" id="nome" name="nome" placeholder="Digite o nome do evento"
                            required>

                        <label for="nome" class="required">Quem está organizando o evento?</label>
                        <input type="text" name="organizador" id="organizador" name="nome"
                            placeholder="Digite o nome organizador do evento" required>

                        <label for="email" class="required">E-mail:</label>
                        <input type="email" name="email" id="email" placeholder="Digite seu e-mail" required>

                        <label for="endereco" class="required">Endereço</label>
                        <input type="text" id="endereco" placeholder="Av/rua, Nº, referência " required>

                        <label for="telefone" class="required">Telefone:</label>
                        <input type="telefone" name="telefone" id="telefone" placeholder="(99) 99999-9999" required>

                        <!--Seleção-->
                        <section id="categoria" nome="categoria"></section>
                        <label for="new-category" class="required">Nova categoria</label>
                        <input type="text" id="new-category" name="new-category"
                            placeholder="Digite o nome da nova categoria" required>
                        <div class="action-form">
                            <button type="button" class="button-cancel">Cancelar</button>
                            <button class="button-save" type="submit">Salvar</button>
                        </div>
                    </fieldset>
                </form>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
