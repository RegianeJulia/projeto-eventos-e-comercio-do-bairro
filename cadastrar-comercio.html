<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar comércio</title>
    <link rel="stylesheet" href="styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <h1>Cadastrar comércio local</h1>
        <h2>Cadastre seu comercio e conheça seus vizinhos.</h2>
        <a href="index.html">Voltar para o início</a>
    </header>
    <main>
        <section class="business-form">
            <div class="business-card">
                <form>
                    <fieldset>
                        <legend>Cadastre seu comércio</legend>

                        <label for="nome" class="required">Razão Social</label>
                        <input type="text" id="nome" name="name" placeholder="Digite o nome do estabelecimento" required>

                        <label for="telefone" class="required">Telefone</label>
                        <input type="phone" id="telefone" name="phone" placeholder="(99) 99999-9999" required>

                        <label for="email" class="required">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

                        <label for="endereco" class="required">Endereço</label>
                        <input type="text" id="endereco" name="address" placeholder="Av/rua, Nº, referência " required>

                        <section id="categoria" nome="categoria"></section>
                        <label for="tipo-de-comercio" class="required">Categoria</label>
                        <Select id="tipo-de-comercio" name="tipo-de-comercio" required>
                            <option value="">Selecione</option>
                            <option value=" acougue-e-casa-de- carne">Açougue e Casa de Carne</option>
                            <option value="beleza-estética">Beleza, Estética e Cuidados Pessoais</option>
                            <option value="boutique">Boutique</option>
                            <option value="farmacia">Farmácia</option>
                            <option value="mercearia">Mercearia</option>
                            <option value="padarias">Padaria</option>
                            <option value="pet-shop">Pet shop</option>
                            <option value="outros">Outros</option>
                        </select>
                        <div id="outra-categoria-container" hidden>
                            <label for="outra-categoria" class="required">Qual é a categoria?</label>
                            <input type="text" id="outra-categoria" name="customCategory" placeholder="Digite a categoria">
                        </div>
                        <div class="action-form">
                            <button type="button" class="button-cancel">Cancelar</button>
                            <button class="button-save" type="submit">Salvar</button>
                        </div>
                    </fieldset>
                </form>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>

</html>
